name: Build Release Artifacts

on:
    pull_request:
        paths:
            - .github/workflows/build-and-release.yml
            - .github/workflows/pr-tag.yml
            - .github/workflows/publish-release.yml
            - electron-builder.yml
            - electron.vite.config.ts
            - package.json
            - package-lock.json
            - release/**
            - scripts/**
            - src/**
    push:
        branches:
            - main
        paths:
            - .github/workflows/build-and-release.yml
            - .github/workflows/pr-tag.yml
            - .github/workflows/publish-release.yml
            - electron-builder.yml
            - electron.vite.config.ts
            - package.json
            - package-lock.json
            - release/**
            - scripts/**
            - src/**
    workflow_dispatch:

concurrency:
    group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    GH_TOKEN: ${{ secrets.OUROBOROS_RELEASE_ASSET_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
    resolve-pr-build:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pull-requests: read
        outputs:
            run-id: ${{ steps.candidate.outputs.result }}
        steps:
            - name: Find matching same-repository PR build
              id: candidate
              uses: actions/github-script@v8
              with:
                  result-encoding: string
                  script: |
                      if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') {
                        return ''
                      }
                      const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha
                      })
                      const pullRequest = associated.data.find(candidate =>
                        candidate.merged_at &&
                        candidate.base.ref === 'main' &&
                        candidate.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                        candidate.merge_commit_sha === context.sha
                      )
                      if (!pullRequest) {
                        core.info('No merged same-repository PR is associated with this main commit')
                        return ''
                      }
                      const response = await github.rest.actions.listWorkflowRuns({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        workflow_id: 'build-and-release.yml',
                        head_sha: pullRequest.head.sha,
                        event: 'pull_request',
                        status: 'success',
                        per_page: 100
                      })
                      const run = response.data.workflow_runs.find(candidate =>
                        candidate.conclusion === 'success' &&
                        candidate.pull_requests.some(item => item.number === pullRequest.number)
                      )
                      if (!run) {
                        core.info(`No successful artifact build found for PR #${pullRequest.number}`)
                        return ''
                      }
                      core.info(`Candidate PR artifact build: ${run.html_url}`)
                      return run.id

    build-packages:
        name: Build ${{ matrix.platform }} release artifacts
        needs: resolve-pr-build
        runs-on: ${{ matrix.os }}

        permissions:
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: macos-latest
                      platform: mac
                    - os: windows-latest
                      platform: win

        steps:
            - name: Check out release commit
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Download matching PR artifact candidate
              id: candidate-download
              if: needs.resolve-pr-build.outputs.run-id != ''
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  run-id: ${{ needs.resolve-pr-build.outputs.run-id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  name: release-assets-${{ matrix.platform }}
                  path: release-assets

            - name: Certify matching PR artifacts for the merge commit
              id: candidate-certify
              if: steps.candidate-download.outcome == 'success'
              continue-on-error: true
              run: >-
                  node scripts/certify-release-artifacts.mjs
                  --dir release-assets
                  --platform ${{ matrix.platform }}
                  --commit ${{ github.sha }}
                  --source-run ${{ needs.resolve-pr-build.outputs.run-id }}

            - name: Install npm
              if: steps.candidate-certify.outcome != 'success'
              run: npm install --global npm@11.19.0

            - name: Install locked dependencies
              if: steps.candidate-certify.outcome != 'success'
              run: npm ci

            - name: Audit release dependencies
              if: steps.candidate-certify.outcome != 'success' && matrix.platform == 'linux'
              run: npm run audit:release

            - name: Test release lock and artifact validation
              if: steps.candidate-certify.outcome != 'success' && matrix.platform == 'linux'
              run: npm run test:release

            - name: Compile once and package selected flavors
              if: steps.candidate-certify.outcome != 'success'
              run: npm run build:release-artifacts -- --platform ${{ matrix.platform }}

            - name: Upload immutable release inputs
              uses: actions/upload-artifact@v7
              with:
                  name: release-assets-${{ matrix.platform }}
                  if-no-files-found: error
                  retention-days: 14
                  path: release-assets/*
