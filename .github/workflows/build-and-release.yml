name: Build Release Artifacts

on:
    pull_request:
        paths:
            # BEGIN GENERATED ARTIFACT INPUT PATHS
            - .github/workflows/build-and-release.yml
            - .github/workflows/publish-release.yml
            - electron-builder.yml
            - electron.vite.config.ts
            - package.json
            - package-lock.json
            - .npmrc
            - tsconfig*.json
            - build/**
            - resources/**
            - release/**
            - scripts/**
            - src/**
            # END GENERATED ARTIFACT INPUT PATHS
    push:
        branches:
            - main
        paths:
            # BEGIN GENERATED ARTIFACT INPUT PATHS
            - .github/workflows/build-and-release.yml
            - .github/workflows/publish-release.yml
            - electron-builder.yml
            - electron.vite.config.ts
            - package.json
            - package-lock.json
            - .npmrc
            - tsconfig*.json
            - build/**
            - resources/**
            - release/**
            - scripts/**
            - src/**
            # END GENERATED ARTIFACT INPUT PATHS
    workflow_dispatch:

concurrency:
    group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-preflight:
        name: Validate release inputs
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Check out release inputs
              uses: actions/checkout@v7

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install npm
              run: npm install --global npm@11.19.0

            - name: Install locked dependencies
              run: npm ci

            - name: Check generated artifact input filters
              run: node scripts/sync-release-input-paths.mjs --check

            - name: Test release lock and artifact validation
              run: npm run test:release

            - name: Validate locked release inputs and package boundary
              run: npm run preflight:release

    build-packages:
        name: Build ${{ matrix.platform }} release artifacts
        needs: release-preflight
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45

        permissions:
            contents: read

        env:
            GH_TOKEN: ${{ secrets.OUROBOROS_RELEASE_ASSET_TOKEN || secrets.GITHUB_TOKEN }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      platform: linux
                    - os: macos-latest
                      platform: mac
                    - os: windows-latest
                      platform: win

        steps:
            - name: Check out release commit
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Set release artifact directory
              id: artifact-directory
              env:
                  OUROBOROS_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/ouroboros-release-assets/${{ matrix.platform }}
              run: >-
                  node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'OUROBOROS_RELEASE_ARTIFACT_DIR=' + process.env.OUROBOROS_RELEASE_ARTIFACT_DIR + '\n')"

            - name: Install npm
              run: npm install --global npm@11.19.0

            - name: Install locked dependencies
              run: npm ci

            - name: Audit release dependencies
              if: matrix.platform == 'linux'
              run: npm run audit:release

            - name: Compile once and package selected flavors
              run: npm run build:release-artifacts -- --platform ${{ matrix.platform }}

            - name: Upload immutable release inputs
              uses: actions/upload-artifact@v7
              with:
                  name: release-assets-${{ matrix.platform }}
                  if-no-files-found: error
                  retention-days: 14
                  path: ${{ env.OUROBOROS_RELEASE_ARTIFACT_DIR }}/*
