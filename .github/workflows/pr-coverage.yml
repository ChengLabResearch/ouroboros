name: PR Test Coverage
on:
  pull_request:
    branches:
      - main

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

jobs:
  native-memory:
    name: Memory collector (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install numpy==1.26.4 psutil==7.1.3 tifffile==2024.6.18 click typing-extensions pytest
      - name: Test native memory readers and collector lifecycle
        working-directory: python
        run: python -m pytest test/test_shared_memory_lifecycle.py test/common/test_memory_macos.py test/test_memory_windows.py test/common/test_memory_managed.py test/common/test_memory_statistics.py test/common/test_memory_identity.py -q

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
        
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        env:
          # Poetry 2.1.3's virtualenv creation can follow Poetry's own Python.
          PIPX_DEFAULT_PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          poetry-version: '2.1.3'

      - name: Install Dependencies
        working-directory: ./python
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install

      - name: Verify test Python version
        working-directory: ./python
        run: |
          poetry run python --version
          poetry run python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 11) else f'Expected Python 3.11, got {sys.version}')"

      - name: Run Tests
        run: |
          poetry run coverage run -m pytest
          poetry run coverage combine
          poetry run coverage report -m
          poetry run coverage xml
        working-directory: ./python
      
      - name: Coverage Badge
        run: |
          poetry run genbadge coverage -i coverage.xml -o coverage.svg
        working-directory: ./python
