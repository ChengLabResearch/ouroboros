name: PR Test Coverage
on:
  pull_request:
    branches:
      - main

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

jobs:
  native-memory-lifecycle:
    name: Shared memory lifecycle (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install PostgreSQL client build tools
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
      - name: Install pipeline and lifecycle test dependencies
        working-directory: python
        run: python -m pip install . pytest
      - name: Test shared-memory ownership and release
        working-directory: python
        run: python -m pytest test/test_shared_memory_lifecycle.py test/pipeline/test_slice_memory_lifecycle.py -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
        
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: '2.1.3'

      - name: Install Dependencies
        working-directory: ./python
        run: poetry install

      - name: Run Tests
        run: |
          poetry run coverage run -m pytest
          poetry run coverage combine
          poetry run coverage report -m
          poetry run coverage xml
        working-directory: ./python
      
      - name: Coverage Badge
        run: |
          poetry run genbadge coverage -i coverage.xml -o coverage.svg
        working-directory: ./python

