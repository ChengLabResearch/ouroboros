name: Publish Prebuilt Release

on:
    push:
        tags:
            - v*.*.*

concurrency:
    group: publish-release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        permissions:
            actions: read
            contents: write

        steps:
            - name: Check out tagged release commit
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set release artifact directory
              id: artifact-directory
              env:
                  OUROBOROS_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/ouroboros-release-assets
              run: >-
                  node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'OUROBOROS_RELEASE_ARTIFACT_DIR=' + process.env.OUROBOROS_RELEASE_ARTIFACT_DIR + '\n')"

            - name: Find certified main build
              id: certified-build
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/select-release-build.mjs --commit "${{ github.sha }}"

            - name: Download certified release artifacts
              uses: actions/download-artifact@v8
              with:
                  run-id: ${{ steps.certified-build.outputs.run-id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  pattern: release-assets-*
                  merge-multiple: true
                  path: ${{ env.OUROBOROS_RELEASE_ARTIFACT_DIR }}

            - name: Verify ancestry, artifact inputs, manifests, and hashes
              env:
                  RELEASE_REF: ${{ github.ref_name }}
              run: >-
                  node scripts/verify-release-artifacts.mjs
                  --dir "${{ env.OUROBOROS_RELEASE_ARTIFACT_DIR }}"
                  --commit ${{ github.sha }}
                  --ref "$RELEASE_REF"
                  --build-commit ${{ steps.certified-build.outputs.source-commit }}
                  --run ${{ steps.certified-build.outputs.run-id }}

            - name: Publish draft release from prebuilt artifacts
              uses: softprops/action-gh-release@v3
              with:
                  draft: true
                  fail_on_unmatched_files: true
                  files: ${{ env.OUROBOROS_RELEASE_ARTIFACT_DIR }}/*
