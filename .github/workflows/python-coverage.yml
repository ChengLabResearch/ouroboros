name: Python Test Coverage

on:
  push:
    paths:
      - .github/workflows/python-coverage.yml
      - python/**/*

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

jobs:
  test-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
        
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        env:
          # Poetry 2.1.3's virtualenv creation can follow Poetry's own Python.
          PIPX_DEFAULT_PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          poetry-version: '2.1.3'

      - name: Install Dependencies
        working-directory: ./python
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install

      - name: Verify test Python version
        working-directory: ./python
        run: |
          poetry run python --version
          poetry run python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 11) else f'Expected Python 3.11, got {sys.version}')"

      - name: Run Tests
        run: |
          poetry run coverage run -m pytest
          poetry run coverage combine
          poetry run coverage report -m
          poetry run coverage xml
        working-directory: ./python

      - name: Coverage Badge
        run: |
          poetry run genbadge coverage -i coverage.xml -o coverage.svg
        working-directory: ./python

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v16
        id: verify-changed-files
        with:
          files: python/coverage.svg

      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add python/coverage.svg
          git commit -m "Updated coverage.svg"

      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
