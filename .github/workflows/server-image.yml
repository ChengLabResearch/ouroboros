name: Build and Certify Server Image

on:
    pull_request:
        paths:
            - .github/workflows/server-image.yml
            - python/**
    push:
        branches:
            - main
        paths:
            - python/**
    workflow_dispatch:

env:
    REGISTRY_IMAGE: ghcr.io/chenglabresearch/ouroboros-server

jobs:
    server-image:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out server source
              uses: actions/checkout@v7

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.11'

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install Poetry
              uses: abatilo/actions-poetry@v4
              with:
                  poetry-version: '2.1.3'

            - name: Install locked Python dependencies
              working-directory: ./python
              run: poetry install

            - name: Test server source
              working-directory: ./python
              run: poetry run pytest

            - name: Build server wheel
              working-directory: ./python
              run: poetry build

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract immutable Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY_IMAGE }}
                  tags: type=sha,prefix=sha-,format=long

            - name: Build and publish server image
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: ./python
                  file: ./python/Dockerfile-prod
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Record certified server digest
              if: github.event_name != 'pull_request'
              run: node scripts/write-server-image-manifest.mjs
              env:
                  OUROBOROS_SERVER_IMAGE_REPOSITORY: ${{ env.REGISTRY_IMAGE }}
                  OUROBOROS_SERVER_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
                  OUROBOROS_SERVER_SOURCE_COMMIT: ${{ github.sha }}

            - name: Upload certified server manifest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: server-image-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 30
                  path: server-image-manifest.json
